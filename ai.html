<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0281af" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="Mathematics quizzes, reusable problems and teaching tools."
    />
    <title>AI assistant · Math Quiz</title>
    <link rel="icon" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <script src="js/appearance-init.js"></script>
    <link rel="stylesheet" href="assets/css/tokens.css?v=14" />
    <link rel="stylesheet" href="assets/css/base.css?v=14" />
    <link rel="stylesheet" href="assets/css/layout.css?v=14" />
    <link rel="stylesheet" href="assets/css/components.css?v=14" />
    <link rel="stylesheet" href="assets/css/pages/ai.css?v=14" />
    <script src="js/math-config.js"></script>
    <script defer src="assets/mathjax.js"></script>
    <script type="module" src="js/app.js"></script>

    <!-- Inline styling for AI chat features within your schema -->
    <style>
      .ai-chat-layout {
        display: flex;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--bg-surface, #ffffff);
      }
      aside.ai-sidebar {
        width: 280px;
        background-color: var(--bg-sidebar, #f1f5f9);
        border-right: 1px solid var(--border-color, #cbd5e1);
        display: flex;
        flex-direction: column;
        z-index: 10;
        transition: transform 0.3s ease;
      }
      .ai-sidebar-header {
        padding: 1rem;
      }
      .ai-new-chat-btn {
        width: 100%;
        justify-content: center;
        background-color: var(--primary, #0281af);
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
      }
      .ai-chat-history-list {
        flex: 1;
        overflow-y: auto;
        padding: 0.5rem 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      .ai-chat-history-item {
        padding: 0.75rem 1rem;
        border-radius: 8px;
        background: transparent;
        color: var(--text-main, #1e293b);
        border: none;
        text-align: left;
        cursor: pointer;
        font-size: 0.9rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ai-chat-history-item:hover {
        background: var(--border-color, #cbd5e1);
      }
      .ai-chat-history-item.active {
        background: var(--primary-light, #e6f3f8);
        color: var(--primary, #0281af);
        font-weight: 600;
      }
      .ai-sidebar-footer {
        padding: 1rem;
        border-top: 1px solid var(--border-color, #cbd5e1);
        font-size: 0.8rem;
        color: var(--text-muted, #64748b);
        display: flex;
        justify-content: space-between;
      }
      .ai-chat-workspace {
        flex: 1;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }
      .ai-chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }
      .ai-welcome-banner {
        text-align: center;
        max-width: 500px;
        margin: auto;
        padding: 2rem;
      }
      .ai-welcome-banner h2 {
        font-size: 1.75rem;
        margin-bottom: 0.5rem;
        color: var(--primary, #0281af);
      }
      .ai-welcome-banner p {
        color: var(--text-muted, #64748b);
        font-size: 0.95rem;
        margin-bottom: 1.5rem;
      }
      .ai-prompt-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: center;
      }
      .ai-chip {
        background: var(--bg-sidebar, #f1f5f9);
        border: 1px solid var(--border-color, #cbd5e1);
        padding: 0.5rem 0.85rem;
        border-radius: 20px;
        font-size: 0.85rem;
        cursor: pointer;
      }
      .ai-chip:hover {
        border-color: var(--primary, #0281af);
        background: var(--primary-light, #e6f3f8);
        color: var(--primary, #0281af);
      }
      .ai-message {
        display: flex;
        gap: 1rem;
        max-width: 800px;
        margin: 0 auto;
        width: 100%;
      }
      .ai-message.user {
        flex-direction: row-reverse;
      }
      .ai-message-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--primary, #0281af);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.9rem;
        flex-shrink: 0;
      }
      .ai-message.user .ai-message-avatar {
        background: #0284c7;
      }
      .ai-message-content {
        padding: 0.85rem 1.15rem;
        border-radius: 12px;
        font-size: 0.95rem;
        line-height: 1.5;
        max-width: calc(100% - 50px);
        word-break: break-word;
      }
      .ai-message.user .ai-message-content {
        background-color: var(--primary, #0281af);
        color: white;
        border-top-right-radius: 2px;
      }
      .ai-message.assistant .ai-message-content {
        background-color: var(--bg-sidebar, #e2e8f0);
        color: var(--text-main, #1e293b);
        border-top-left-radius: 2px;
      }
      .ai-chat-input-container {
        padding: 1rem 1.5rem;
        border-top: 1px solid var(--border-color, #cbd5e1);
      }
      .ai-chat-input-wrapper {
        max-width: 800px;
        margin: 0 auto;
        display: flex;
        align-items: flex-end;
        background: var(--input-bg, #ffffff);
        border: 1px solid var(--border-color, #cbd5e1);
        border-radius: 12px;
        padding: 0.5rem 0.75rem;
      }
      .ai-chat-input-wrapper textarea {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text-main, #1e293b);
        font-family: inherit;
        font-size: 0.95rem;
        resize: none;
        max-height: 150px;
        padding: 0.5rem 0;
        outline: none;
      }
      .ai-send-btn {
        background: var(--primary, #0281af);
        color: white;
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        margin-bottom: 2px;
      }
      @media (max-width: 768px) {
        aside.ai-sidebar {
          position: absolute;
          height: 100%;
          transform: translateX(-100%);
        }
        aside.ai-sidebar.open {
          transform: translateX(0);
        }
      }
    </style>
  </head>
  <body data-page="ai">
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header"></header>
    <main id="main" tabindex="-1">
      <noscript>This website needs JavaScript to sign in and load quizzes.</noscript>

      <!-- Fully functional chat interface inside your #main container -->
      <div class="ai-chat-layout">
        <aside class="ai-sidebar" id="ai-sidebar">
          <div class="ai-sidebar-header">
            <button class="ai-new-chat-btn" id="ai-new-chat-btn">＋ New Chat</button>
          </div>
          <div class="ai-chat-history-list" id="ai-chat-history-list"></div>
          <div class="ai-sidebar-footer">
            <span>Math Assistant</span>
            <span>Online</span>
          </div>
        </aside>

        <section class="ai-chat-workspace">
          <div class="ai-chat-messages" id="ai-chat-messages">
            <div class="ai-welcome-banner" id="ai-welcome-banner">
              <h2>Welcome to Math Assistant</h2>
              <p>Ask questions about algebra, calculus, geometry, or generate custom math quiz problems instantly with LaTeX formatting.</p>
              <div class="ai-prompt-chips">
                <button class="ai-chip" data-prompt="Generate a quadratic equation problem with steps">Quadratic Equations</button>
                <button class="ai-chip" data-prompt="Explain integration by parts with an example">Calculus Integration</button>
                <button class="ai-chip" data-prompt="Create a geometry quiz on circles">Circle Theorems</button>
              </div>
            </div>
          </div>

          <div class="ai-chat-input-container">
            <div class="ai-chat-input-wrapper">
              <textarea id="ai-user-input" placeholder="Ask a math question or request a quiz problem..." rows="1"></textarea>
              <button class="ai-send-btn" id="ai-send-btn" aria-label="Send message">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
              </button>
            </div>
          </div>
        </section>
      </div>
    </main>
    <footer id="site-footer"></footer>
    <nav id="mobile-nav" aria-label="Mobile navigation"></nav>

    <!-- Script to power the interactive chat features within your schema -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        let chats = JSON.parse(localStorage.getItem('math_ai_chats')) || [];
        let currentChatId = null;

        const historyList = document.getElementById('ai-chat-history-list');
        const chatMessages = document.getElementById('ai-chat-messages');
        const welcomeBanner = document.getElementById('ai-welcome-banner');
        const userInput = document.getElementById('ai-user-input');
        const sendBtn = document.getElementById('ai-send-btn');
        const newChatBtn = document.getElementById('ai-new-chat-btn');
        const sidebar = document.getElementById('ai-sidebar');

        userInput.addEventListener('input', function() {
          this.style.height = 'auto';
          this.style.height = (this.scrollHeight) + 'px';
        });

        function saveChats() {
          localStorage.setItem('math_ai_chats', JSON.stringify(chats));
        }

        function createNewChat() {
          const newChat = {
            id: 'chat_' + Date.now(),
            title: 'New Math Chat',
            messages: []
          };
          chats.unshift(newChat);
          currentChatId = newChat.id;
          saveChats();
          renderSidebar();
          renderMessages();
        }

        function switchChat(chatId) {
          currentChatId = chatId;
          renderSidebar();
          renderMessages();
        }

        function renderSidebar() {
          historyList.innerHTML = '';
          if (chats.length === 0) {
            createNewChat();
            return;
          }
          if (!currentChatId && chats.length > 0) {
            currentChatId = chats[0].id;
          }
          chats.forEach(chat => {
            const btn = document.createElement('button');
            btn.className = `ai-chat-history-item ${chat.id === currentChatId ? 'active' : ''}`;
            btn.textContent = chat.title;
            btn.addEventListener('click', () => switchChat(chat.id));
            historyList.appendChild(btn);
          });
        }

        function renderMessages() {
          const currentChat = chats.find(c => c.id === currentChatId);
          chatMessages.innerHTML = '';
          if (!currentChat || currentChat.messages.length === 0) {
            chatMessages.appendChild(welcomeBanner);
            welcomeBanner.style.display = 'block';
            return;
          }
          welcomeBanner.style.display = 'none';
          currentChat.messages.forEach(msg => {
            appendMessageNode(msg.sender, msg.text, false);
          });
          if (window.MathJax && window.MathJax.typesetPromise) {
            window.MathJax.typesetPromise([chatMessages]).catch(err => console.log('MathJax error:', err));
          }
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendMessageNode(sender, text, scroll = true) {
          const msgDiv = document.createElement('div');
          msgDiv.className = `ai-message ${sender}`;

          const avatar = document.createElement('div');
          avatar.className = 'ai-message-avatar';
          avatar.textContent = sender === 'user' ? 'U' : 'AI';

          const content = document.createElement('div');
          content.className = 'ai-message-content';
          content.innerHTML = text.replace(/\n/g, '<br>');

          msgDiv.appendChild(avatar);
          msgDiv.appendChild(content);
          chatMessages.appendChild(msgDiv);

          if (scroll) {
            chatMessages.scrollTop = chatMessages.scrollHeight;
          }
        }

        function getAIResponse(query) {
          const q = query.toLowerCase();
          if (q.includes('quadratic')) {
            return "Here is a standard quadratic equation problem for your quiz:\n\nSolve for $x$ in the equation: $$2x^2 - 8x + 6 = 0$$\n\n**Step 1:** Factor out the common coefficient $2$:\n$$2(x^2 - 4x + 3) = 0$$\n\n**Step 2:** Factor the quadratic expression:\n$$(x - 1)(x - 3) = 0$$\n\n**Solution:** $x = 1$ or $x = 3$.";
          } else if (q.includes('integral') || q.includes('calculus')) {
            return "Let's evaluate the indefinite integral using integration by parts:\n\n$$\\int x e^x \\, dx$$\n\n**Step 1:** Choose $u = x$ and $dv = e^x dx$.\n**Step 2:** Then $du = dx$ and $v = e^x$.\n\n**Step 3:** Apply the formula:\n$$x e^x - \\int e^x \\, dx = x e^x - e^x + C$$";
          } else {
            return `That's an interesting math query regarding "${query}". For any general mathematical expression like $\\sum_{i=1}^{n} i = \\frac{n(n+1)}{2}$, breaking down the problem helps students grasp concepts quicker.`;
          }
        }

        function handleSendMessage() {
          const text = userInput.value.trim();
          if (!text) return;

          if (!currentChatId || chats.length === 0) {
            createNewChat();
          }

          const currentChat = chats.find(c => c.id === currentChatId);
          if (currentChat.messages.length === 0) {
            currentChat.title = text.length > 25 ? text.substring(0, 25) + '...' : text;
          }

          currentChat.messages.push({ sender: 'user', text: text });
          userInput.value = '';
          userInput.style.height = 'auto';

          renderSidebar();
          renderMessages();

          setTimeout(() => {
            const aiReply = getAIResponse(text);
            currentChat.messages.push({ sender: 'assistant', text: aiReply });
            saveChats();
            renderMessages();
          }, 600);

          saveChats();
        }

        newChatBtn.addEventListener('click', createNewChat);
        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSendMessage();
          }
        });

        document.querySelectorAll('.ai-chip').forEach(chip => {
          chip.addEventListener('click', () => {
            userInput.value = chip.getAttribute('data-prompt');
            userInput.style.height = 'auto';
            userInput.style.height = (userInput.scrollHeight) + 'px';
            userInput.focus();
          });
        });

        if (chats.length === 0) {
          createNewChat();
        } else {
          currentChatId = chats[0].id;
          renderSidebar();
          renderMessages();
        }
      });
    </script>
  </body>
</html>
