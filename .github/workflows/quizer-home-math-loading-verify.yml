name: Quizer home stylesheet-first MathJax verification
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: quizer-home-math-loading-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Unit, static and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - name: Install locked frontend and backend test dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix functions --no-audit --no-fund
          npm run prepare:backend
      - name: Verify stylesheet loading and MathJax behavior
        run: node --test tests/unit/home-math-loading.test.mjs
      - name: Run frontend unit tests
        run: npm test
      - name: Validate static site and build
        run: |
          npm run verify:static
          npm run build
  browser:
    name: Chrome cold-load CSS before 2 MB MathJax
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check playwright==1.58.0
      - name: Real browser first-paint and resource timing
        run: python tests/qa/home-math-firstpaint-browser.py
