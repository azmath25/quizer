name: Quizer mobile card tap and desktop flip verification
on:
  push:
    branches: [fix/mobile-quiz-card-tap-2026-11-06]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quizer-card-touch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Frontend unit, static and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - name: Install test dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix functions --no-audit --no-fund
          npm run prepare:backend
      - name: Mobile card and button contract
        run: node --test tests/unit/mobile-quiz-card-link.test.mjs
      - name: Full test suite
        run: npm test
      - name: Static site and build
        run: |
          npm run verify:static
          npm run build
  browser:
    name: Real touch navigation, scrolling and desktop flip
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check playwright==1.58.0
      - name: Browser test at 320/390/430 and 1280px
        run: python tests/qa/mobile-quiz-card-browser.py
