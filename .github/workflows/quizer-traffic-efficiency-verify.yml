name: Quizer P-TRAFFIC.1 request efficiency verification
on:
  push:
    branches:
      - perf/quizer-safe-api-coalescing-2026-11-05
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quizer-traffic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend-backend:
    name: Client requests, backend, static, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix functions --no-audit --no-fund
          npm run prepare:backend
      - name: Request coalescing and idempotency regression
        run: node --test tests/unit/requests-traffic.test.mjs
      - name: Root unit tests
        run: npm test
      - name: Backend unit tests
        run: npm run test:backend
      - name: Frontend/static validation
        run: |
          npm run verify:static
          npm run build
  firebase-integration:
    name: Firebase emulator / transport
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix functions --no-audit --no-fund
          npm run prepare:backend
      - name: Emulator integration / transport
        run: |
          npm run test:integration
          npm run test:transport
