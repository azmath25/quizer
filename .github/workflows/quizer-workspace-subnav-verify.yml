name: Quizer consistent workspace subnavigation QA
on:
  push:
    branches: [fix/consistent-workspace-subnav-2026-11-05]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quizer-subnav-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix functions --no-audit --no-fund
          npm run prepare:backend
      - name: Submenu static and unit verification
        run: |
          node --test tests/unit/workspace-subnav-consistency.test.mjs
          npm test
      - name: Frontend static checks and build
        run: |
          npm run verify:static
          npm run build
  responsive-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - name: Install browser and emulator dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix functions --no-audit --no-fund
          npm run prepare:backend
          python -m pip install --disable-pip-version-check playwright==1.58.0
      - name: Browser QA across teacher workspaces
        run: python tests/qa/mobile-author-browser.py
