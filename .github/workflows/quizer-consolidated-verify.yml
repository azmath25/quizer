name: Consolidated Quizer feature verification (no deployment)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quizer-feature-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-backend-static:
    name: Unit, backend, static and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix functions --no-audit --no-fund
      - name: Verify synchronized backend contract
        run: npm run prepare:backend
      - name: Validate release script syntax without running it
        run: bash -n scripts/release/quizer-one-shot.sh
      - name: Unit tests
        run: npm test
      - name: Backend tests
        run: npm run test:backend
      - name: Static verifier
        run: npm run verify:static
      - name: Frontend build
        run: npm run build

  emulators:
    name: Emulator integration and transport
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix functions --no-audit --no-fund
      - name: Test Firebase emulator rules, attempts, grading and transport
        run: |
          npm run test:integration
          npm run test:transport

  browser-qa:
    name: Chromium mobile browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install app and browser test dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix functions --no-audit --no-fund
          npm run prepare:backend
          python -m pip install --disable-pip-version-check playwright==1.58.0
      - name: Mobile quiz runner
        run: python tests/qa/mobile-runner-browser.py
      - name: Mobile author flow
        run: python tests/qa/mobile-author-browser.py
      - name: Quiz rules workflow
        run: python tests/qa/quiz-rules-browser.py
      - name: AI Studio mobile layout
        run: python tests/qa/ai-studio-browser.py
      - name: New math keyboard and handwriting browser smoke
        run: python tests/qa/math-answer-browser.py
