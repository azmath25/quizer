name: Quizer Mimo teacher chat UI checks (no deploy)

on:
  push:
    branches:
      - feature/quizer-mimo-teacher-chat-ui-20261106
  pull_request:
    branches:
      - feature/quizer-mimo-api-bridge-20261106
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quizer-mimo-chat-ui-20261106
  cancel-in-progress: true

jobs:
  frontend-regression:
    name: Frontend, unit, static and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix functions --no-audit --no-fund
      - run: npm run prepare:backend
      - run: npm test
      - run: npm run verify:static
      - run: npm run build

  firebase-emulator-regression:
    name: Existing quiz backend, emulator and transport tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix functions --no-audit --no-fund
      - run: npm run test:backend
      - run: npm run test:integration
      - run: npm run test:transport
